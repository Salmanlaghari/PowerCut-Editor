name: Build Signed APK & AAB

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug & Release APK/AAB
      run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

    - name: Sign APK (if keystore secrets are provided)
      # We provide a standard placeholder/signing step for a signed production release.
      # If secrets are not available, it safely packages the unsigned/release builds.
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-Debug-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-Release-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Release AAB (App Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-Release-Bundle
        path: app/build/outputs/bundle/release/*.aab
