name: Build Signed APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Setup Android NDK for native export engine
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26d
        add-to-path: true

    - name: Install CMake via Android SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" 2>/dev/null || true
        echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

    - name: Read Version Name
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/1/')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]*\([0-9]*\).*/1/')
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "Detected versionName=$VERSION_NAME versionCode=$VERSION_CODE"

    - name: Prepare Signing Key and Config
      run: |
        if [ -n "${{ secrets.POWERCUT_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.POWERCUT_KEYSTORE_BASE64 }}" | base64 --decode > app/powercut-release.jks
          echo "POWERCUT_STORE_PASSWORD=${{ secrets.POWERCUT_STORE_PASSWORD }}" >> local.properties
          echo "POWERCUT_KEY_ALIAS=${{ secrets.POWERCUT_KEY_ALIAS }}" >> local.properties
          echo "POWERCUT_KEY_PASSWORD=${{ secrets.POWERCUT_KEY_PASSWORD }}" >> local.properties
        fi
      shell: bash

    - name: Build Debug APK + Debug AAB + Release APK + Release AAB
      run: ./gradlew assembleDebug assembleRelease bundleDebug bundleRelease --stacktrace
      env:
        POWERCUT_STORE_PASSWORD: ${{ secrets.POWERCUT_STORE_PASSWORD }}
        POWERCUT_KEY_ALIAS: ${{ secrets.POWERCUT_KEY_ALIAS }}
        POWERCUT_KEY_PASSWORD: ${{ secrets.POWERCUT_KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-v${{ steps.version.outputs.version_name }}-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-v${{ steps.version.outputs.version_name }}-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Upload Debug AAB (App Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-v${{ steps.version.outputs.version_name }}-Debug-AAB
        path: app/build/outputs/bundle/debug/*.aab
        if-no-files-found: warn

    - name: Upload Release AAB (App Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-v${{ steps.version.outputs.version_name }}-Release-AAB
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: warn

  validate-ffmpeg:
    name: Validate FFmpeg filter graphs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg (if not pre-installed)
      run: |
        if command -v ffmpeg &>/dev/null; then
          echo "FFmpeg already available:"
          ffmpeg -version | head -1
        else
          echo "FFmpeg not found — installing via apt (timeout 120s)..."
          timeout 120 sudo apt-get update -qq
          timeout 120 sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
        fi

    - name: Run VideoProcessor FFmpeg validation
      run: python3 scripts/validate_video_processor_ffmpeg.py --ffmpeg "$(which ffmpeg)"

    - name: Validate time-based transitions with real FFmpeg
      # Renders real MP4s for every transition the editor exposes and verifies
      # xfade names, per-transition render, transition timing (decoded frames),
      # multi-clip A->B->C offsets/duration, A/V lock, the production graph
      # shape, and the hard-cut fallback.
      run: python3 scripts/validate_transitions_ffmpeg.py --ffmpeg "$(which ffmpeg)" --ffprobe "$(which ffprobe)"

    - name: Validate text animations with real FFmpeg
      # Renders every animation the Animations panel offers (TextAnimationCatalog)
      # with real FFmpeg and proves it is genuinely per-frame: decoded frames at
      # t=0.3s and t=1.8s must differ. Also audits the catalog source for the
      # forbidden init-time-only mechanisms (fontcolor@expr, fontcolor_expr,
      # eval=, drawbox/boxblur/gblur time expressions).
      run: python3 scripts/validate_animations_ffmpeg.py --ffmpeg "$(which ffmpeg)" --ffprobe "$(which ffprobe)"
# trigger
