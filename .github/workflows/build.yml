name: Build Signed APK & AAB

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Prepare Signing Key and Config
      run: |
        if [ -n "${{ secrets.POWERCUT_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.POWERCUT_KEYSTORE_BASE64 }}" | base64 --decode > app/powercut-release.jks
          echo "POWERCUT_STORE_PASSWORD=${{ secrets.POWERCUT_STORE_PASSWORD }}" >> local.properties
          echo "POWERCUT_KEY_ALIAS=${{ secrets.POWERCUT_KEY_ALIAS }}" >> local.properties
          echo "POWERCUT_KEY_PASSWORD=${{ secrets.POWERCUT_KEY_PASSWORD }}" >> local.properties
        fi
      shell: bash

    - name: Build Debug & Release APK/AAB
      run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace
      env:
        POWERCUT_STORE_PASSWORD: ${{ secrets.POWERCUT_STORE_PASSWORD }}
        POWERCUT_KEY_ALIAS: ${{ secrets.POWERCUT_KEY_ALIAS }}
        POWERCUT_KEY_PASSWORD: ${{ secrets.POWERCUT_KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-Debug-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-Release-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Upload Release AAB (App Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-Release-Bundle
        path: app/build/outputs/bundle/release/*.aab
