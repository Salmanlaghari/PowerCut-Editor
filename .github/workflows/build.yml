name: Build Signed APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Setup Android NDK for native export engine
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26d
        add-to-path: true

    - name: Install CMake via Android SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" 2>/dev/null || true
        echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

    - name: Read Version Name
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*//')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]*\([0-9]*\).*//')
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "Detected versionName=$VERSION_NAME versionCode=$VERSION_CODE"

    - name: Prepare Signing Key and Config
      run: |
        if [ -n "${{ secrets.POWERCUT_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.POWERCUT_KEYSTORE_BASE64 }}" | base64 --decode > app/powercut-release.jks
          echo "POWERCUT_STORE_PASSWORD=${{ secrets.POWERCUT_STORE_PASSWORD }}" >> local.properties
          echo "POWERCUT_KEY_ALIAS=${{ secrets.POWERCUT_KEY_ALIAS }}" >> local.properties
          echo "POWERCUT_KEY_PASSWORD=${{ secrets.POWERCUT_KEY_PASSWORD }}" >> local.properties
        fi
      shell: bash

    - name: Build Debug APK + Debug AAB + Release APK + Release AAB
      run: ./gradlew assembleDebug assembleRelease bundleDebug bundleRelease --stacktrace
      env:
        POWERCUT_STORE_PASSWORD: ${{ secrets.POWERCUT_STORE_PASSWORD }}
        POWERCUT_KEY_ALIAS: ${{ secrets.POWERCUT_KEY_ALIAS }}
        POWERCUT_KEY_PASSWORD: ${{ secrets.POWERCUT_KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-v${{ steps.version.outputs.version_name }}-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-v${{ steps.version.outputs.version_name }}-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Upload Debug AAB (App Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-v${{ steps.version.outputs.version_name }}-Debug-AAB
        path: app/build/outputs/bundle/debug/*.aab
        if-no-files-found: warn

    - name: Upload Release AAB (App Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: PowerCut-v${{ steps.version.outputs.version_name }}-Release-AAB
        path: app/build/outputs/bundle/release/*.aab
        if-no-files-found: warn
# trigger
