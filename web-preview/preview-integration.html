// preview-integration.html — Drop-in integration example for PowerCut preview.
//
// Replaces the visible <video> element with a hardware-accelerated WebGL canvas.
// A hidden HTMLVideoElement is kept only as the frame source. All active
// timeline effects are resolved at currentTime and passed to GPU shaders as
// uniforms/textures through a deterministic effect graph.
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PowerCut Preview Integration</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; font-family: system-ui, sans-serif; color: #e8e8ee; }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #glCanvas { background: #000; border-radius: 14px; display: block; }
  #hiddenVideo { display: none; } /* frame source only — never displayed */
  #hud { position: absolute; top: 12px; left: 12px; font-size: 12px; opacity: 0.75; }
  #bar { position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; gap: 8px; }
  button { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #3a3f52; background: #161623; color: #e8e8ee; cursor: pointer; }
</style>
</head>
<body>
  <div id="stage">
    <!-- HIDDEN frame source — kept only as the frame source, never displayed -->
    <video id="hiddenVideo" playsinline muted></video>
    <!-- Hardware-accelerated WebGL canvas — replaces the visible video element -->
    <canvas id="glCanvas" width="1920" height="1080"></canvas>
    <div id="hud">PowerCut WebGL Preview</div>
    <div id="bar">
      <button id="playBtn">Play</button>
      <button id="filterBtn">Filter</button>
      <button id="chromaBtn">Chroma Key</button>
      <button id="exportBtn">Export</button>
    </div>
  </div>
  <script type="module">
    import { PowerCutPreview, EffectKind, Ease, buildColorMatrix, hexToLinear } from './src/powercut-preview.js';

    const canvas = document.getElementById('glCanvas');
    const video = document.getElementById('hiddenVideo');
    video.src = 'sample.mp4'; // user's clip — hidden, used only as frame source

    // Build the effect graph. This is the SAME graph the export worker consumes.
    const nodes = [
      { kind: EffectKind.Source, id: 'src', params: { startUs: 0, durationUs: 30_000_000 } },
      { kind: EffectKind.Filter, id: 'warm', params: {}, keyframes: [] },
      { kind: EffectKind.ChromaKey, id: 'ck', params: {
          keyColorR: 0.0, keyColorG: 1.0, keyColorB: 0.0,
          tolerance: 0.4, softness: 0.3, spill: 0.5, hasBg: false,
          bgColorR: 0.0, bgColorG: 0.0, bgColorB: 0.0, blendMode: 0
      }, keyframes: [] },
      { kind: EffectKind.Blend, id: 'out', params: { bgAlpha: 1.0, blendMode: 0 } }
    ];
    const durationUs = 30_000_000;

    const preview = new PowerCutPreview(canvas, {
      sourceVideo: video,
      nodes, durationUs,
      powerPreference: 'high-performance',
      onContextLost: () => console.warn('WebGL context lost'),
      onContextRestored: () => console.info('WebGL context restored'),
      onFallback: (reason, e) => console.warn('Fallback to software path:', reason, e),
      onFrameRendered: (t) => { /* update scrubber from t */ }
    });

    // UI/effect/timeline changes invalidate the current frame and trigger an
    // immediate render, even while paused.
    document.getElementById('filterBtn').onclick = () => {
      preview.setGraph(nodes, durationUs);
    };
    document.getElementById('chromaBtn').onclick = () => {
      // Toggle chroma key on/off — deterministic re-evaluation.
      const ck = nodes.find(n => n.kind === EffectKind.ChromaKey);
      ck.params.tolerance = ck.params.tolerance === 0.4 ? 0.55 : 0.4;
      preview.setGraph(nodes, durationUs);
    };
    document.getElementById('playBtn').onclick = () => preview.setPlaying(!preview.playing);
    document.getElementById('exportBtn').onclick = async () => {
      const res = await preview.export({ fps: 30, width: 1920, height: 1080, onProgress: (p) => console.log('export', p) });
      console.log('export result', res);
    };
  </script>
</body>
</html>
